<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Devtw0 — FiveM, Roblox and web developer">
  <title>Devtw0 — FiveM, Roblox and web developer</title>
  <defs>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 40) scale(520 320)">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 360) scale(520 300)">
      <stop offset="0" stop-color="#2de2e6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="dg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b7bff"/><stop offset=".5" stop-color="#5b8cff"/><stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <linearGradient id="wg" x1="187.08" y1="12.12" x2="205.28" y2="42.12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#2de2e6"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#2de2e6" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .glow { animation: breathe 6s ease-in-out infinite; }
      .glow2 { animation: breathe 6s ease-in-out -3s infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .line { opacity: 0; animation: appear .4s ease-out forwards; }
      .l1 { animation-delay: .3s } .l2 { animation-delay: .9s } .l3 { animation-delay: 1.5s }
      .l4 { animation-delay: 2.1s } .l5 { animation-delay: 2.7s } .l6 { animation-delay: 3.3s }
      .l7 { animation-delay: 3.9s } .l8 { animation-delay: 4.5s }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .75 } 50% { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes appear { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="360" fill="#05060a"/>
    <rect class="glow" width="1280" height="360" fill="url(#glowV)"/>
    <rect class="glow2" width="1280" height="360" fill="url(#glowC)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>

    <!-- Logo (static/brand/devtw0-logo.svg) -->
    <g transform="translate(72 70) scale(1.25)">
      <g transform="translate(-10.5,-8.50)">
        <path d="M14 12V52" stroke="#eef0f8" stroke-width="7" stroke-linecap="round"/>
        <path d="M24 12H32A20 20 0 0 1 32 52H24" fill="none" stroke="url(#dg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M33 24L27 40" stroke="#eef0f8" stroke-width="5" stroke-linecap="round"/>
        <path d="M78.46 42.28Q76.1 42.28 74.04 41.1Q71.98 39.92 70.74 37.64Q69.5 35.36 69.5 32.12V31.48Q69.5 28.24 70.74 25.96Q71.98 23.68 74.02 22.5Q76.06 21.32 78.46 21.32Q80.26 21.32 81.48 21.74Q82.7 22.16 83.46 22.8Q84.22 23.44 84.62 24.16H85.34V13.72H90.38V41.72H85.42V39.32H84.7Q84.02 40.44 82.6 41.36Q81.18 42.28 78.46 42.28ZM79.98 37.88Q82.3 37.88 83.86 36.38Q85.42 34.88 85.42 32V31.6Q85.42 28.72 83.88 27.22Q82.34 25.72 79.98 25.72Q77.66 25.72 76.1 27.22Q74.54 28.72 74.54 31.6V32Q74.54 34.88 76.1 36.38Q77.66 37.88 79.98 37.88Z M103.82 42.28Q100.86 42.28 98.6 41.02Q96.34 39.76 95.08 37.46Q93.82 35.16 93.82 32.04V31.56Q93.82 28.44 95.06 26.14Q96.3 23.84 98.54 22.58Q100.78 21.32 103.74 21.32Q106.66 21.32 108.82 22.62Q110.98 23.92 112.18 26.22Q113.38 28.52 113.38 31.56V33.28H98.94Q99.02 35.32 100.46 36.6Q101.9 37.88 103.98 37.88Q106.1 37.88 107.1 36.96Q108.1 36.04 108.62 34.92L112.74 37.08Q112.18 38.12 111.12 39.34Q110.06 40.56 108.3 41.42Q106.54 42.28 103.82 42.28ZM98.98 29.52H108.26Q108.1 27.8 106.88 26.76Q105.66 25.72 103.7 25.72Q101.66 25.72 100.46 26.76Q99.26 27.8 98.98 29.52Z M120.82 41.72 114.5 21.88H119.86L124.46 38.04H125.18L129.78 21.88H135.14L128.82 41.72Z M144.98 41.72Q143.02 41.72 141.8 40.5Q140.58 39.28 140.58 37.24V26.04H135.62V21.88H140.58V15.72H145.62V21.88H151.06V26.04H145.62V36.36Q145.62 37.56 146.74 37.56H150.58V41.72Z M156.02 41.72 153.22 21.88H158.22L159.98 38.32H160.7L163.26 21.88H171.34L173.9 38.32H174.62L176.38 21.88H181.38L178.58 41.72H170.22L167.66 25.28H166.94L164.38 41.72Z" fill="#eef0f8"/>
        <path d="M196.18 42.12Q193.38 42.12 191.33 41.06Q189.29 40 188.18 38.06Q187.08 36.11 187.08 33.49V20.75Q187.08 18.11 188.18 16.18Q189.29 14.24 191.33 13.18Q193.38 12.12 196.18 12.12Q199.01 12.12 201.04 13.18Q203.07 14.24 204.18 16.18Q205.28 18.11 205.28 20.74V33.49Q205.28 36.11 204.18 38.06Q203.07 40 201.04 41.06Q199.01 42.12 196.18 42.12ZM196.18 37.87Q198.21 37.87 199.36 36.71Q200.51 35.55 200.51 33.49V20.75Q200.51 18.66 199.37 17.52Q198.24 16.37 196.18 16.37Q194.14 16.37 192.99 17.52Q191.85 18.66 191.85 20.75V33.49Q191.85 35.55 193.01 36.71Q194.16 37.87 196.18 37.87ZM187.75 34.35 201.26 19.89H204.61L191.1 34.35Z" fill="url(#wg)"/>
      </g>
    </g>

    <!-- Status pill -->
    <g transform="translate(72 158)">
      <rect width="250" height="30" rx="15" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".35"/>
      <circle class="dot" cx="18" cy="15" r="4" fill="#34d399"/>
      <text x="32" y="20" class="mono" font-size="13" fill="#34d399">Available for new projects</text>
    </g>

    <text x="72" y="236" class="sans" font-size="36" font-weight="700" fill="#eef0f8">Custom scripts, games &amp; websites.</text>
    <text x="72" y="268" class="sans" font-size="17" fill="#eef0f8" fill-opacity=".6">Freelance developer — performance, security and polish in every line.</text>

    <!-- Domain chips -->
    <g class="mono" font-size="13" fill="#eef0f8">
      <g transform="translate(72 296)">
        <rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="18" cy="15" r="4" fill="#ff8a1f"/><text x="30" y="20">FiveM</text>
      </g>
      <g transform="translate(174 296)">
        <rect width="100" height="30" rx="15" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="18" cy="15" r="4" fill="#ff4d5e"/><text x="30" y="20">Roblox</text>
      </g>
      <g transform="translate(284 296)">
        <rect width="76" height="30" rx="15" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".12"/>
        <circle cx="18" cy="15" r="4" fill="#2de2e6"/><text x="30" y="20">Web</text>
      </g>
    </g>

    <!-- Terminal window -->
    <g transform="translate(760 56)">
      <rect width="448" height="248" rx="14" fill="#0d1018" fill-opacity=".92" stroke="url(#border)"/>
      <path d="M0 14A14 14 0 0 1 14 0H434A14 14 0 0 1 448 14V38H0Z" fill="#ffffff" fill-opacity=".03"/>
      <circle cx="22" cy="19" r="5.5" fill="#f87171"/>
      <circle cx="40" cy="19" r="5.5" fill="#fbbf24"/>
      <circle cx="58" cy="19" r="5.5" fill="#34d399"/>
      <text x="224" y="24" text-anchor="middle" class="mono" font-size="12" fill="#eef0f8" fill-opacity=".45">devtw0@studio: ~</text>
      <line x1="0" y1="38" x2="448" y2="38" stroke="#ffffff" stroke-opacity=".07"/>

      <g class="mono" font-size="14">
        <text x="22" y="70" class="line l1"><tspan fill="#7c5cff">$</tspan><tspan fill="#eef0f8"> whoami</tspan></text>
        <text x="22" y="92" class="line l2" fill="#eef0f8" fill-opacity=".65">devtw0 — freelance — FiveM · Roblox · Web</text>
        <text x="22" y="122" class="line l3"><tspan fill="#7c5cff">$</tspan><tspan fill="#eef0f8"> ls ./stack</tspan></text>
        <text x="22" y="144" class="line l4"><tspan fill="#ff8a1f">fivem/</tspan><tspan fill="#ff4d5e" dx="14">roblox/</tspan><tspan fill="#2de2e6" dx="14">web/</tspan><tspan fill="#9b7bff" dx="14">discord-bots/</tspan></text>
        <text x="22" y="174" class="line l5"><tspan fill="#7c5cff">$</tspan><tspan fill="#eef0f8"> resmon --script my_script</tspan></text>
        <text x="22" y="196" class="line l6" fill="#34d399">✓ compiled · 0.00 ms</text>
        <text x="22" y="226" class="line l7"><tspan fill="#7c5cff">$</tspan><tspan fill="#eef0f8"> ./deploy --status</tspan></text>
        <g class="line l8"><rect class="cursor" x="186" y="214" width="9" height="16" fill="#2de2e6"/></g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="359" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
